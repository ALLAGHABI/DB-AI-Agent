<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartDB AI - المحلل الذكي</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Main CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="app-container fade-in">

        <!-- Sidebar: Settings & Connection -->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">🤖</div>
                <div class="brand-text">
                    <h1>SmartDB AI</h1>
                    <p>مدير قواعد البيانات الذكي</p>
                </div>
            </div>

            <div class="form-section">
                <div class="section-title">إعدادات الاتصال</div>

                <div class="input-group">
                    <label class="input-label">مفتاح OpenRouter API</label>
                    <input type="password" id="apiKey" class="form-input" placeholder="sk-or-v1-...">
                </div>

                <div class="input-group">
                    <label class="input-label">نوع القاعدة</label>
                    <select id="dbType" class="form-select">
                        <option value="sqlite">SQLite (ملف محلي)</option>
                        <option value="mysql">MySQL</option>
                        <option value="postgresql">PostgreSQL</option>
                    </select>
                </div>

                <!-- SQLite Settings -->
                <div id="sqliteSettings">
                    <div class="input-group">
                        <label class="input-label">مسار الملف</label>
                        <div style="display:flex; gap:0.5rem">
                            <input type="text" id="sqliteFile" class="form-input" placeholder="data/db.sqlite" readonly>
                            <input type="file" id="fileInput" accept=".db,.sqlite,.sqlite3" hidden>
                            <button type="button" class="btn btn-secondary"
                                onclick="document.getElementById('fileInput').click()">📂</button>
                        </div>
                        <div style="margin-top: 5px;">
                            <button type="button" class="btn btn-ghost" style="font-size: 0.8rem; padding: 2px;"
                                onclick="App.useSampleDb()">استخدم قاعدة بيانات تجريبية</button>
                        </div>
                    </div>
                </div>

                <!-- Server Settings -->
                <div id="serverSettings" class="hidden">
                    <div class="input-group">
                        <input type="text" id="host" class="form-input" placeholder="Host (localhost)">
                    </div>
                    <div class="input-group">
                        <input type="text" id="port" class="form-input" placeholder="Port">
                    </div>
                    <div class="input-group">
                        <input type="text" id="database" class="form-input" placeholder="Database Name">
                    </div>
                    <div class="input-group">
                        <input type="text" id="username" class="form-input" placeholder="Username">
                    </div>
                    <div class="input-group">
                        <input type="password" id="password" class="form-input" placeholder="Password">
                    </div>
                </div>

                <button id="btnConnect" class="btn btn-primary" style="width: 100%; justify-content: center;"
                    onclick="App.connect()">
                    اتصال بالقاعدة
                </button>
            </div>

            <div class="form-section" style="margin-top: auto;">
                <div class="section-title">إعدادات النموذج</div>
                <select id="aiModel" class="form-select">
                    <option value="anthropic/claude-3.5-sonnet">Claude 3.5 Sonnet</option>
                    <option value="openai/gpt-4o">GPT-4o</option>
                    <option value="openai/gpt-4o-mini">GPT-4o Mini</option>
                    <option value="meta-llama/llama-3.1-70b-instruct">Llama 3.1 70B</option>
                </select>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1rem;">
                    <div id="connectionBadge" class="status-badge status-disconnected">
                        <span class="status-dot"></span> غير متصل
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">

            <!-- Query Input Section -->
            <section class="query-card">
                <div class="section-title" style="margin-bottom: 1rem;">ماذا تريد أن تعرف؟</div>
                <div class="query-input-wrapper">
                    <textarea id="queryInput" class="query-textarea"
                        placeholder="اكتب سؤالك هنا... مثال: كم عدد العملاء النشطين؟"></textarea>
                    <div class="query-actions">
                        <div style="font-size: 0.8rem; color: var(--text-muted);">يدعم اللغة العربية والإنجليزية</div>
                        <button id="btnExecute" class="btn btn-primary" onclick="App.executeQuery()">
                            نفذ الأمر 🚀
                        </button>
                    </div>
                </div>
            </section>

            <!-- Results Section -->
            <section class="results-area">
                <div class="tabs-header">
                    <div class="tab-btn active" data-tab="data">البيانات</div>
                    <div class="tab-btn" data-tab="sql">كود SQL</div>
                    <div class="tab-btn" data-tab="chart" style="margin-right: auto; opacity: 0.5; cursor: not-allowed;"
                        title="قريباً">رسوم بيانية 🔒</div>
                </div>

                <div id="dataTab" class="tab-content active">
                    <div id="dataResults">
                        <div class="empty-state"
                            style="text-align: center; color: var(--text-muted); margin-top: 4rem;">
                            <div style="font-size: 3rem; margin-bottom: 1rem;">📊</div>
                            <p>النتائج ستظهر هنا</p>
                        </div>
                    </div>
                </div>

                <div id="sqlTab" class="tab-content">
                    <pre id="sqlDisplay" class="sql-display">-- لم يتم تنفيذ أي استعلام بعد</pre>
                </div>
            </section>

        </main>

    </div>

    <!-- Main Logic -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
